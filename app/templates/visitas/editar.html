{% extends "base.html" %}
{% block title %}Editar visita{% endblock %}
{% block content %}
<div class="fondo-doc-wrap">
    <div class="hoja-doc">
        <div class="encabezado-doc">
            <h1>Editar visita</h1>
        </div>
        <div class="cuerpo-doc">

            <p class="text-muted">{{ visita.instalacion.nombre }}</p>

            <form method="POST" class="mt-3">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" name="fecha" class="form-control" required value="{{ visita.fecha.isoformat() }}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Técnico</label>
                        <input type="text" class="form-control" value="{{ visita.nombre_tecnico }}" disabled>
                        {% if visita.orden_trabajo %}
                        <div class="form-text">Se asigna desde la <a href="{{ url_for('ordenes.editar', ot_id=visita.orden_trabajo.id) }}">Orden de Trabajo {{ visita.orden_trabajo.numero }}</a>.</div>
                        {% endif %}
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Estado</label>
                        <select name="estado" class="form-select">
                            {% for e in estados %}
                            <option value="{{ e }}" {% if visita.estado == e %}selected{% endif %}>{{ e }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Observaciones</label>
                    <textarea name="observaciones" class="form-control" rows="3">{{ visita.observaciones or '' }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{{ url_for('visitas.detalle', visita_id=visita.id) }}" class="btn btn-link">Cancelar</a>
            </form>

            <form method="POST" action="{{ url_for('visitas.eliminar', visita_id=visita.id) }}" class="mt-4"
                  onsubmit="return confirm('¿Eliminar esta visita y todo lo cargado en ella (formularios, fotos)?');">
                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash me-1"></i>Eliminar visita</button>
            </form>

        </div>
    </div>
</div>
{% endblock %}
