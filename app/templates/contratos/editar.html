{% extends "base.html" %}
{% block title %}Editar {{ contrato.nombre }}{% endblock %}
{% block content %}
<div class="fondo-doc-wrap">
    <div class="hoja-doc">
        <div class="encabezado-doc">
            <h1>Editar contrato</h1>
        </div>
        <div class="cuerpo-doc">

            <form method="POST" class="mt-3">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" required value="{{ contrato.nombre }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select">
                        {% for e in estados %}
                        <option value="{{ e }}" {% if contrato.estado == e %}selected{% endif %}>{{ e }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" name="activo" class="form-check-input" id="activo" {% if contrato.activo %}checked{% endif %}>
                    <label class="form-check-label" for="activo">Activo</label>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{{ url_for('contratos.detalle', contrato_id=contrato.id) }}" class="btn btn-link">Cancelar</a>
            </form>

        </div>
    </div>
</div>
{% endblock %}
