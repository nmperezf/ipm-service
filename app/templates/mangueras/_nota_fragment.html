<div data-modal-titulo="Agregar nota de mantenimiento"></div>
<p class="text-muted mb-1">{{ manguera.numero_serie }}</p>

<form method="POST" class="mt-3">
    <div class="mb-3">
        <label class="form-label">Nota</label>
        <textarea name="texto" class="form-control" rows="3" placeholder="Ej: reempalme de racor, inspección visual" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Guardar nota</button>
    <a href="{{ url_for('mangueras.lista', instalacion_id=instalacion.id) }}" class="btn btn-link">Cancelar</a>
</form>
