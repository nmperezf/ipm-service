<div data-modal-titulo="Registrar prueba hidrostática"></div>
<p class="text-muted mb-1">Manguera {{ manguera.numero_serie }}{% if manguera.equipo %} · {{ manguera.equipo.nombre }}{% endif %}</p>

<form method="POST" class="mt-3">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" class="form-control" value="{{ hoy }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Resultado</label>
            <select name="resultado" class="form-select" required>
                {% for r in resultados %}
                <option value="{{ r }}">{{ r }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Presión aplicada (PSI)</label>
            <input type="number" step="any" name="presion_aplicada" class="form-control">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Tiempo de sostenimiento (min)</label>
            <input type="number" step="any" name="tiempo_minutos" class="form-control">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">N° certificado / técnico</label>
        <input type="text" name="certificado" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Guardar ensayo</button>
    <a href="{{ url_for('mangueras.lista', instalacion_id=instalacion.id) }}" class="btn btn-link">Cancelar</a>
</form>
