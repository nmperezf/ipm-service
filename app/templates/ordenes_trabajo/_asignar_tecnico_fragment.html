<div data-modal-titulo="Asignar técnico — {{ ot.numero }}"></div>
<p class="text-muted small mb-3">{{ ot.instalacion.cliente.nombre }} — {{ ot.instalacion.nombre }}</p>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Técnico</label>
        <select name="tecnico_id" class="form-select" autofocus>
            <option value="">-- Sin asignar --</option>
            {% for t in tecnicos %}
            <option value="{{ t.id }}" {% if ot.tecnico_id == t.id %}selected{% endif %}>{{ t.nombre_completo or t.username }}{% if t.rol == 'Jefe' %} (Jefe){% endif %}</option>
            {% endfor %}
        </select>
        <div class="form-text">Un Jefe también puede asignarse a sí mismo para salir a hacer el servicio.</div>
    </div>
    <button type="submit" class="btn btn-primary">Confirmar asignación</button>
    <a href="{{ url_for('ordenes.detalle', ot_id=ot.id) }}" class="btn btn-link">Cancelar</a>
</form>
