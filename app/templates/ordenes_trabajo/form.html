{% extends "base.html" %}
{% block title %}Nueva orden de trabajo{% endblock %}
{% block content %}
<div class="pagina-ancha">
    <h1>Nueva orden de trabajo</h1>
    <div class="tarjeta-doc">
            <p class="text-muted">Para trabajo que no viene de un contrato: reparaciones, llamados de cliente, visitas técnicas puntuales, etc.</p>

            <form method="POST" class="mt-3">
                <div class="mb-3">
                    <label class="form-label">Instalación</label>
                    <select name="instalacion_id" class="form-select" required>
                        <option value="">-- Seleccioná --</option>
                        {% for inst in instalaciones %}
                        <option value="{{ inst.id }}">{{ inst.cliente.nombre }} — {{ inst.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Tipo</label>
                        <select name="tipo" class="form-select">
                            {% for t in tipos %}
                            <option value="{{ t }}">{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Prioridad</label>
                        <select name="prioridad" class="form-select">
                            {% for p in prioridades %}
                            <option value="{{ p }}" {% if p == 'Media' %}selected{% endif %}>{{ p }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Técnico asignado</label>
                        <select name="tecnico_id" class="form-select">
                            <option value="">-- Sin asignar --</option>
                            {% for t in tecnicos %}
                            <option value="{{ t.id }}">{{ t.nombre_completo or t.username }}{% if t.rol != 'Técnico' %} ({{ t.rol }}){% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Fecha de apertura</label>
                        <input type="date" name="fecha_apertura" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción del trabajo solicitado</label>
                    <textarea name="descripcion" class="form-control" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Crear orden de trabajo</button>
                <a href="{{ url_for('ordenes.listar') }}" class="btn btn-link">Cancelar</a>
            </form>

    </div>
</div>
{% endblock %}
