{% extends "base.html" %}
{% block title %}{{ 'Editar' if instalacion else 'Nueva' }} instalación{% endblock %}
{% block content %}
<div class="pagina-ancha">
    <h1>{{ 'Editar instalación' if instalacion else 'Nueva instalación' }}</h1>
    <div class="tarjeta-doc angosta">

            <p class="text-muted">{{ cliente.nombre }}</p>

            <form method="POST" class="mt-3">
                <div class="mb-3">
                    <label class="form-label">Nombre de la instalación</label>
                    <input type="text" name="nombre" class="form-control" required value="{{ instalacion.nombre or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Dirección</label>
                    <input type="text" name="direccion" class="form-control" value="{{ instalacion.direccion or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Observaciones</label>
                    <textarea name="observaciones" class="form-control" rows="3">{{ instalacion.observaciones or '' }}</textarea>
                </div>
                <button type="submit" class="btn btn-dark">Guardar</button>
                <a href="{{ url_for('clientes.detalle', cliente_id=cliente.id) }}" class="btn btn-link">Cancelar</a>
            </form>

    </div>
</div>
{% endblock %}
