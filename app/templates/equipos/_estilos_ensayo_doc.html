<style>
:root {
    --azul: #1A2233;
    --azul-oscuro: #000000;
    --rojo: #E2131D;
    --rojo-suave: #FBEAE7;
    --tinta-doc: #1f2937;
    --tinta-muted-doc: #6b7280;
    --borde-doc: #dfe4ea;
    --superficie-doc: #ffffff;
    --superficie-muted-doc: #f6f8fa;
    --fondo-doc: #eef1f5;
    --ok-bg: #e8f7ee;
    --ok-fg: #16803c;
    --edit-hover: #ffffdd;
    --edit-focus: #fff6bf;
}
html[data-bs-theme="dark"] {
    --tinta-doc: #e7ebf1; --tinta-muted-doc: #9aa4b2; --borde-doc: #313a46;
    --superficie-doc: #171b21; --superficie-muted-doc: #1d222a; --fondo-doc: #101317;
    --ok-bg: #123321; --ok-fg: #4ade80; --rojo-suave: #3a1620;
    --edit-hover: #3a3620; --edit-focus: #4a4322;
}

.barra-superior-doc {
    position: sticky; top: 0; z-index: 15; background: var(--azul-oscuro); color: #fff;
    display: flex; align-items: center; gap: .9rem; padding: .55rem 1.1rem; margin: 0 -.75rem 1.2rem;
    font-size: .82rem; box-shadow: 0 2px 10px rgba(0,0,0,.15); border-radius: 0 0 .4rem .4rem; flex-wrap: wrap;
}
.barra-superior-doc .titulo-barra { font-weight: 700; letter-spacing: .01em; }
.barra-superior-doc .spacer { flex: 1; }
#dirty-badge {
    display: none; align-items: center; gap: .4rem; background: rgba(255,255,255,.12);
    padding: .3rem .7rem; border-radius: 100px; font-size: .74rem;
}
#dirty-badge.visible { display: inline-flex; }
#dirty-badge .punto { width: 7px; height: 7px; border-radius: 50%; background: #fbbf24; }
.btn-doc {
    font-size: .8rem; font-weight: 600; border-radius: .45rem; padding: .4rem .85rem;
    border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: .4rem;
    text-decoration: none;
}
.btn-doc-primary { background: var(--rojo); color: #fff; }
.btn-doc-primary:hover { background: #B3101A; color: #fff; }
.btn-doc-outline { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
.btn-doc-outline:hover { border-color: #fff; color: #fff; }
.toggle-ft { display: flex; align-items: center; gap: .4rem; font-size: .78rem; color: #fff; margin-bottom: 0; }

.fondo-doc-wrap { background: var(--fondo-doc); border-radius: .6rem; padding: 1.4rem; margin: 0 -.25rem 1.5rem; }
.hoja-doc { max-width: 1040px; margin: 0 auto; background: var(--superficie-doc); border-radius: .6rem;
    box-shadow: 0 4px 22px rgba(20,30,45,.12); overflow: hidden; color: var(--tinta-doc); }

.encabezado-doc { background: var(--azul-oscuro); color: #fff; padding: 1.1rem 1.6rem; display: flex;
    align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.encabezado-doc .marca { display: flex; align-items: center; gap: .6rem; }
.encabezado-doc .marca img { height: 30px; width: auto; }
.encabezado-doc h1 { margin: 0; font-size: 1.25rem; font-weight: 700; text-align: right; color: #fff; }
.encabezado-doc .sub { font-size: .74rem; opacity: .85; text-align: right; margin-top: .15rem; }
.filete-rojo-doc { height: 3px; background: var(--rojo); }

.cuerpo-doc { padding: 1.5rem 1.6rem 2.2rem; }
.seccion-titulo-doc {

    letter-spacing: .06em; font-weight: 700; margin: 1.8rem -1.6rem .9rem; padding: .55rem 1.6rem .5rem;
    border-bottom: 3px solid var(--rojo);
}
.seccion-titulo-doc:first-child { margin-top: 0; }

.grid-3-doc { display: grid; grid-template-columns: repeat(3, 1fr); gap: .9rem 1.2rem; }
.campo-doc label { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;

.campo-doc .valor-doc { font-size: .95rem; padding: .3rem .4rem; border-radius: .35rem; min-height: 1.4em; }

.campo-doc input.valor-doc, .campo-doc select.valor-doc {

    transition: background .1s;
}
.campo-doc input.valor-doc:hover, .campo-doc select.valor-doc:hover { background: var(--edit-hover); }
.campo-doc input.valor-doc:focus, .campo-doc select.valor-doc:focus {
    background: var(--edit-focus); outline: 2px solid var(--azul); outline-offset: 1px;
}

.tabla-doc-scroll { overflow-x: auto; }
.tabla-doc { width: 100%; border-collapse: collapse; font-size: .82rem; margin-top: .3rem; }
.tabla-doc th, .tabla-doc td { border: 1px solid var(--borde-doc); padding: .4rem .55rem; text-align: center; }

.tabla-doc tbody td { font-variant-numeric: tabular-nums; }
.tabla-doc td.computada-doc { background: var(--superficie-muted-doc); color: var(--tinta-doc); font-weight: 600; }

.mostrar-ft .col-ft { display: table-cell; }

.tabla-doc input {
    border: none; background: transparent; width: 100%; text-align: center; font: inherit; color: inherit;
    padding: .15rem; border-radius: .25rem; transition: background .1s;
}
.tabla-doc input:hover { background: var(--edit-hover); }
.tabla-doc input:focus { background: var(--edit-focus); outline: 2px solid var(--azul); outline-offset: 0; }

.grafico-wrap-doc { margin-top: .6rem; background: var(--superficie-muted-doc); border: 1px solid var(--borde-doc);
    border-radius: .5rem; padding: 1rem; }
.leyenda-manual-doc { display: flex; gap: 1.2rem; flex-wrap: wrap; font-size: .74rem; color: var(--tinta-muted-doc);
    margin-top: .6rem; }
.leyenda-manual-doc span { display: inline-flex; align-items: center; gap: .35rem; }
.leyenda-manual-doc i { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }

.chip-doc { display: inline-flex; align-items: center; gap: .3rem; font-size: .74rem; font-weight: 700;
    padding: .18rem .55rem; border-radius: 100px; }
.chip-doc-ok { background: var(--ok-bg); color: var(--ok-fg); }
.chip-doc-no { background: var(--rojo-suave); color: var(--rojo); }
.tabla-doc tr.fila-no-cumple-doc td { background: var(--rojo-suave); }

.banner-doc {
    border-radius: .5rem; padding: .9rem 1.2rem; text-align: center; font-weight: 700; font-size: 1.1rem;
    margin: 1.2rem 0;
}
.banner-doc-ok { background: var(--ok-bg); color: var(--ok-fg); }
.banner-doc-no { background: var(--rojo-suave); color: var(--rojo); }
.banner-doc-warn { background: var(--superficie-muted-doc); color: var(--tinta-muted-doc); font-weight: 400; font-size: .9rem; }
.banner-doc small { display: block; font-size: .78rem; font-weight: 400; margin-top: .3rem; }

textarea#comentarios-doc {
    width: 100%; min-height: 5rem; font-size: .88rem; padding: .6rem .7rem; border-radius: .4rem;
    border: 1px solid var(--borde-doc); resize: vertical; background: var(--superficie-doc); color: var(--tinta-doc);
}
textarea#comentarios-doc:hover { background: var(--edit-hover); }
textarea#comentarios-doc:focus { background: var(--edit-focus); outline: 2px solid var(--azul); }

.validacion-row-doc { display: flex; gap: 1.4rem; flex-wrap: wrap; align-items: flex-end; margin-top: .6rem; }
.validacion-row-doc .campo-doc select, .validacion-row-doc .campo-doc input {
    font-size: .88rem; padding: .35rem .5rem; border-radius: .35rem; border: 1px solid var(--borde-doc);
    background: var(--superficie-muted-doc); color: var(--tinta-doc);
}

.pie-nota-doc { font-size: .72rem; color: var(--tinta-muted-doc); margin-top: 2rem; border-top: 1px solid var(--borde-doc);
    padding-top: .8rem; }

@media (max-width: 720px) { .grid-3-doc { grid-template-columns: 1fr 1fr; } }
@media print {
    .barra-superior-doc, .no-imprimir, nav, footer, .nav-inferior { display: none !important; }
    .fondo-doc-wrap { background: #fff; padding: 0; margin: 0; }
    .hoja-doc { box-shadow: none; }
    .encabezado-doc, .seccion-titulo-doc, .chip-doc, .banner-doc {
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
}
</style>
